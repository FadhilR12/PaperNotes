services:
  webapp:
    build:
      context: ../../
      dockerfile: ./deploy/build/sveltekit/Dockerfile
    environment:
      - ORIGIN=${DEMO_PAPERNOTES_ORIGIN}
      - POCKETBASE_URL=http://pocketbase:8090
    restart: unless-stopped
    ports:
      - 3000:3000
  pocketbase:
    build:
      context: ../../
      dockerfile: ./deploy/build/pocketbase/Dockerfile
      args:
        - PB_VERSION=0.40.4
    environment:
      - SUPERUSER_EMAIL=admin@example.com
      - SUPERUSER_PASS=admin123
      - PORT=8090
    restart: unless-stopped
    volumes:
      - ${PWD}/pb/pb_hooks:/pb/pb_hooks
      - ${PWD}/pb/pb_migrations:/pb/pb_migrations
      # - ${PWD}/pb/pb_data:/pb/pb_data # in actual production this should be uncommented so the data persists on disk
    ports:
      - "8090:8090"